spring.application.name=sri-lakshmi-gold-buyers
server.port=${PORT:8080}

# Required: set MONGODB_URI in the environment; never hard-code credentials here.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Keep API date values in a consistent ISO-8601 JSON format.
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
